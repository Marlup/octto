name: Portable package candidate

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify quality gates
        run: bun run check

      - name: Build
        run: bun run build

      - name: Create package candidate
        run: npm pack

      - name: Upload package candidate
        uses: actions/upload-artifact@v4
        with:
          name: octto-portable-package-candidate
          path: octto-portable-*.tgz
